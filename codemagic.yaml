workflows:
  android-workflow:
    name: Iraq Booking Final Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Force Generate Android Folder
        script: |
          # هذا الأمر سيقوم بمسح أي تعارض وإنشاء مجلد android من الصفر
          npx expo prebuild --platform android --clean --no-install
      - name: Build Android APK
        script: |
          # الدخول للمجلد الذي تم إنشاؤه قسرياً وبناء التطبيق
          cd android && ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
