workflows:
  android-workflow:
    name: Ayn Al-Iraq Final Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Prebuild Android System
        script: |
          # هذا السطر سيقرأ ملف app.json الجديد وينشئ مجلد android
          npx expo prebuild --platform android --no-install
      - name: Build Android APK
        script: |
          # الآن المجلد موجود، سندخل إليه ونستخرج الـ APK
          cd android && ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
